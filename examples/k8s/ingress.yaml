# Exposes the Syncthing web GUI over HTTPS via whatever ingress controller
# fronts your private/overlay network (Tailscale, Cloudflare Tunnel, a plain
# VPN + ingress-nginx, etc.). Swap `ingressClassName` and annotations for
# your own controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syncthing
  namespace: syncthing
  annotations: {}
spec:
  ingressClassName: your-ingress-class
  tls:
    - hosts:
        - syncthing.your-private-domain.example
  defaultBackend:
    service:
      name: syncthing
      port:
        number: 8384
