# The raw Syncthing sync protocol (TCP *and* UDP 22000) needs its own
# network path if your ingress controller is HTTP(S)-only. This assumes a
# LoadBalancer implementation that can hand out addresses on your private
# network (e.g. Tailscale's `loadBalancerClass: tailscale`, MetalLB, etc.) —
# swap for whatever your cluster has.
apiVersion: v1
kind: Service
metadata:
  name: syncthing-sync
  namespace: syncthing
  annotations: {}
spec:
  type: LoadBalancer
  loadBalancerClass: your-lb-class
  ports:
    - name: sync-tcp
      port: 22000
      targetPort: 22000
      protocol: TCP
  selector:
    app: syncthing
